[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vertebrate"]

[project]
name = "vertebrate"
version = "0.2.0"
description = "Open backbones for data architecture"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Matt Christie", email = "christiemj09@gmail.com" },
]

# Core dependencies
dependencies = [
]

# Optional dependency groups
[project.optional-dependencies]

postgres = [
  "SQLAlchemy>=2",
  "psycopg2-binary",
]

tables = [
  "SQLAlchemy>=2",
]

transfers = [
  "networkx>=3",
  "pandas>=3",
  "pyarrow>=23",
  "SQLAlchemy>=2",
]

dag = [
  "networkx>=3",
]

luigi = [
  "networkx>=3",
  "luigi>=3",
]

dagster = [
  "networkx>=3",
  "dagster>=1",
]

htcondor = [
  "htcondor",
]

[project.urls]
Repository = "https://github.com/glue-lab/vertebrate"

[dependency-groups]
test = [
  "pytest>=9.1",
  "pytest-cov>=7.1",
]
dev = [
  "ruff>=0.17",
  { include-group = "test" },
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
# Deferred to the typing step: mutable defaults in signatures, ClassVar registries
ignore = ["B006", "RUF012"]

[tool.pytest]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
xfail_strict = true

[tool.coverage.run]
source = ["vertebrate"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["@abstractmethod"]
